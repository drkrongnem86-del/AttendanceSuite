name: attendance_mobile
description: "AttendanceSuite - BVĐK Ninh Thuan - Mobile attendance management with embedded Python web server (Chaquopy) + Flutter UI."
publish_to: 'none'
version: 2.6.2+35

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # v2.6.0: Native Flutter UI calls Python backend via HTTP
  http: ^1.2.0

  # v2.6.0: Native OpenVPN client (Sophos BV) - same as camera_viewer
  openvpn_flutter: ^1.3.4

  # Settings persistence
  shared_preferences: ^2.2.2

  # Date/time formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/vpn/
