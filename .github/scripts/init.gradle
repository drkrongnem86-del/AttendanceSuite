// Force ALL Gradle resolutions through Aliyun mirror.
// Critical for AGP build where kotlin-compiler-embeddable (96MB) gets stuck
// downloading from repo.maven.apache.org on slow networks.
//
// NOTE: We only modify project-level buildscript + repositories here.
// Do NOT add mavenLocal() in settingsEvaluated -> pluginManagement because
// Flutter's settings.gradle uses pluginManagement { repositories {...} } which
// conflicts with FAIL_ON_PROJECT_REPOS mode.
allprojects {
    buildscript {
        repositories {
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            maven { url 'https://maven.aliyun.com/repository/jcenter' }
            maven { url 'https://maven.aliyun.com/repository/central' }
            google()
            mavenCentral()
        }
    }
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        google()
        mavenCentral()
    }
}
