<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AttendanceSuite - BVĐK Ninh Thuận</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  min-height: 100vh;
  color: #e0e0e0;
}
header {
  background: #0f1729;
  border-bottom: 1px solid #2a3a5a;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 20px;
}
header h1 { color: #00d4ff; font-size: 18px; }
header .conn { margin-left: auto; font-size: 13px; }
.conn-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: bold;
}
.conn-badge.online { background: #1a4a1a; color: #5fff7f; border: 1px solid #2a6a2a; }
.conn-badge.offline { background: #4a1a1a; color: #ff8888; border: 1px solid #6a2a2a; }
.conn-badge .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
}
.conn-badge.online .dot { background: #5fff7f; }
.conn-badge.offline .dot { background: #ff8888; }

.tabs {
  background: #0a1220;
  display: flex;
  border-bottom: 1px solid #2a3a5a;
}
.tab {
  padding: 12px 24px;
  cursor: pointer;
  color: #888;
  border-bottom: 2px solid transparent;
  font-size: 14px;
  transition: all 0.15s;
  user-select: none;
}
.tab:hover { color: #00d4ff; background: #1a2a3a; }
.tab.active {
  color: #00d4ff;
  border-bottom-color: #00d4ff;
  background: #1a2a3a;
  font-weight: bold;
}
.tab .icon { margin-right: 6px; }

iframe {
  width: 100%;
  height: calc(100vh - 100px);
  border: none;
  background: #16213e;
}
.open-new {
  font-size: 11px;
  margin-left: 8px;
  padding: 2px 6px;
  background: #2a3a5a;
  color: #00d4ff;
  text-decoration: none;
  border-radius: 3px;
}
.open-new:hover { background: #3a4a6a; }
</style>
</head>
<body>
<header>
  <h1>🏥 AttendanceSuite - BVĐK Ninh Thuận</h1>
  <span class="conn" id="connStatus">
    <span class="conn-badge offline"><span class="dot"></span>Đang kiểm tra...</span>
  </span>
</header>
<div class="tabs">
  <div class="tab active" data-tab="viewer" onclick="switchTab('viewer')">
    <span class="icon">📊</span>Đọc log chấm công
    <a class="open-new" href="http://localhost:8080/" target="_blank" onclick="event.stopPropagation()">↗ mở tab mới</a>
  </div>
  <div class="tab" data-tab="simulator" onclick="switchTab('simulator')">
    <span class="icon">🖥</span>X628 PRO Simulator
    <a class="open-new" href="http://localhost:8081/" target="_blank" onclick="event.stopPropagation()">↗ mở tab mới</a>
  </div>
  <div class="tab" data-tab="live" onclick="switchTab('live')">
    <span class="icon">📡</span>Live Status
    <a class="open-new" href="http://localhost:8080/api/live/page" target="_blank" onclick="event.stopPropagation()">↗ mở tab mới</a>
  </div>
</div>
<iframe id="frame" src="http://localhost:8080/"></iframe>

<script>
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab[data-tab="' + name + '"]').classList.add('active');
  document.getElementById('frame').src = (name === 'viewer' ? 'http://localhost:8080/'
    : name === 'simulator' ? 'http://localhost:8081/'
    : 'http://localhost:8080/api/live/page');
}

async function checkConn() {
  try {
    const r = await fetch('http://localhost:8080/api/status', {cache: 'no-store'});
    const j = await r.json();
    const el = document.getElementById('connStatus');
    if (j && j.running !== undefined) {
      el.innerHTML = '<span class="conn-badge online"><span class="dot"></span>Server OK - ' + (j.message || 'sẵn sàng') + '</span>';
    } else {
      el.innerHTML = '<span class="conn-badge online"><span class="dot"></span>Viewer online</span>';
    }
  } catch (e) {
    document.getElementById('connStatus').innerHTML = '<span class="conn-badge offline"><span class="dot"></span>Server offline</span>';
  }
}
checkConn();
setInterval(checkConn, 10000);
</script>
</body>
</html>
